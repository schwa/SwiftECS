disabled_rules:
  # Tests assert exact counts, including scalar notification counters.
  - empty_count
  # A failed unwrap in a test is a test failure.
  - force_unwrapping
  # Suites group related cases; their total size is not a useful limit.
  - type_body_length
  # Benchmarks are long linear setup-and-measure scripts.
  - cyclomatic_complexity
  - function_body_length
